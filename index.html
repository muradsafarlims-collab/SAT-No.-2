<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No. 2 Daily</title>
<meta name="description" content="Upload a PDF of SAT Reading and Writing questions and practice ten a day in an exam-room style interface, with answers and explanations at the end.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<style>
/* Concept: a quiet exam room. The test screens copy the layout of a digital SAT (dashed rules, split passage/question panes, question map);
   home, import and results get a "test day" treatment: admit-one ticket, pencil yellow, and a bubble answer sheet. */
:root{
  color-scheme:light;
  --bg:#e9ecf2; --paper:#ffffff; --ink:#0d1117; --muted:#566074; --line:#ccd2de; --soft:#f1f3f8;
  --blue:#1a4fd8; --blue-ink:#ffffff; --blue-soft:#e4ebff;
  --pencil:#f5c518; --pencil-ink:#2b2100;
  --flag:#c8341b; --good:#12794a; --good-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fbe6e3; --warn-bg:#fff2cc; --warn:#6b4b00;
  --sans:'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0d13; --paper:#141925; --ink:#eef1f8; --muted:#9aa3b8; --line:#2b3347; --soft:#1b2132;
  --blue:#7a9bff; --blue-ink:#0a0d13; --blue-soft:#1c2a55;
  --pencil:#f5c518; --pencil-ink:#2b2100;
  --flag:#ff8264; --good:#5fd197; --good-bg:#10301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn-bg:#3a2c0c; --warn:#f2c56b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0d13; --paper:#141925; --ink:#eef1f8; --muted:#9aa3b8; --line:#2b3347; --soft:#1b2132;
  --blue:#7a9bff; --blue-ink:#0a0d13; --blue-soft:#1c2a55;
  --pencil:#f5c518; --pencil-ink:#2b2100;
  --flag:#ff8264; --good:#5fd197; --good-bg:#10301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn-bg:#3a2c0c; --warn:#f2c56b;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body.examing{background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body.examing::before{background:var(--paper)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label.drop:focus-within{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue);font-weight:600;text-underline-offset:3px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:11px 22px;font-weight:700;min-height:46px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.pen{background:var(--pencil);border-color:var(--ink);color:var(--pencil-ink)}
.btn.pen:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{padding:15px 28px;font-size:1.05rem}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.good>i{background:var(--good)}
.p-wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:22px 64px}

/* ---------- Home ---------- */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.brand .mk{background:var(--pencil);color:var(--pencil-ink);padding:1px 10px;border-radius:6px;transform:rotate(-2deg);display:inline-block;border:2px solid var(--ink)}
.ticket{position:relative;display:grid;grid-template-columns:1fr 150px;background:var(--paper);border:2px solid var(--ink);border-radius:18px}
.ticket::before,.ticket::after{content:"";position:absolute;right:63px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.ticket::before{top:-14px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-14px;clip-path:inset(0 0 50% 0)}
.t-main{padding:26px 26px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.t-main h2{font-size:1.9rem;letter-spacing:-.02em}
.t-stub{border-left:2px dashed var(--ink);padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;text-align:center}
.t-stub .no{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.barcode{width:100%;height:46px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 12px,transparent 12px 14px,var(--ink) 14px 15px,transparent 15px 19px)}
.hi{background:linear-gradient(transparent 55%,var(--pencil) 55% 92%,transparent 92%);padding:0 2px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.strip i{aspect-ratio:1;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.strip i.l1{background:#f7dd7c;border-color:#e0bf3d}.strip i.l2{background:#9fd8b6;border-color:#6bb88b}.strip i.l3{background:#3aa56e;border-color:#2b8a58}
.strip i.now{outline:2px solid var(--ink);outline-offset:1px}
.cardx{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats b{display:block;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .nm{font-weight:700;overflow-wrap:anywhere}
.set .bar{grid-column:1/-1}
.set.active .nm::before{content:"●";color:var(--blue);margin-right:6px}
.notice{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:.875rem;color:var(--muted)}

/* ---------- Import ---------- */
label.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px dashed var(--ink);border-radius:16px;padding:34px 18px;background:var(--paper);cursor:pointer}
label.drop.over{background:var(--blue-soft);border-color:var(--blue)}
label.drop input{position:absolute;opacity:0;width:1px;height:1px}
label.drop b{font-size:1.15rem}
details.paste{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.paste summary{cursor:pointer;font-weight:600}
textarea.big{width:100%;min-height:160px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);resize:vertical}
.pv{display:flex;flex-direction:column}
.pv-i{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.pv-i:first-child{border-top:0}
.pv-i .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pv-i .s{overflow-wrap:anywhere;font-size:.92rem}
select.ans{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px}
input.txt{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--paper)}

/* ---------- Exam chrome ---------- */
.exam{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px)}
.xh{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.xh-in{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;min-height:68px;padding-block:8px}
.xh-title{font-weight:700;font-size:1.05rem}
.xh-c{display:flex;flex-direction:column;align-items:center;gap:3px}
.timer{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.over{color:var(--bad)}
.pill{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:1px 14px;font-size:.78rem;font-weight:600}
.xh-r{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:4px 10px;font-size:.72rem;font-weight:600;border-radius:8px}
.tool:hover{background:var(--soft)}
.dash{height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 22px,transparent 22px 28px);opacity:.85}
.pop{position:absolute;z-index:40;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop.dir{left:max(16px,env(safe-area-inset-left,0px));top:calc(100% + 6px);width:min(560px,calc(100vw - 32px))}
.pop.notes{right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(360px,calc(100vw - 32px))}
.pop textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);resize:vertical;margin-top:8px}
.xm{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.xm.single{grid-template-columns:1fr}
.pane{padding:26px max(20px,env(safe-area-inset-left,0px)) 40px;min-width:0}
.pane.passage{border-right:3px solid var(--line);background:var(--paper)}
.xm.single .qpane{max-width:760px;margin:0 auto;width:100%}
.passage .ptxt{font-family:var(--serif);font-size:1.12rem;line-height:1.7;max-width:62ch}
.passage .ptxt p+p{margin-top:1em}
.qhead{display:flex;align-items:center;gap:12px;background:var(--soft);border-bottom:2px solid var(--ink);margin:-26px -20px 20px;padding:8px 16px;flex-wrap:wrap}
.xm.single .qhead{margin:0 0 20px;border-radius:6px 6px 0 0}
.qnum{background:var(--ink);color:var(--paper);font-weight:700;min-width:30px;height:30px;display:grid;place-items:center;border-radius:4px;padding:0 6px;font-variant-numeric:tabular-nums}
.mark{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-weight:600;padding:4px 6px;border-radius:6px}
.mark:hover{background:var(--line)}
.mark.on{color:var(--flag)}
.mark.on svg{fill:var(--flag)}
.abc{margin-left:auto;border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;padding:2px 8px;font-weight:700;font-size:.82rem}
.abc span{text-decoration:line-through}
.abc.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.qtext{font-size:1.06rem;max-width:62ch;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:12px}
.cw{display:flex;gap:8px;align-items:stretch}
.ch{flex:1;display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;min-height:54px;min-width:0}
.ch:hover{background:var(--soft)}
.ch .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.88rem}
.ch .t{overflow-wrap:anywhere}
.ch.sel{border:3px solid var(--blue);padding:10.5px 12.5px;background:var(--blue-soft)}
.ch.sel .l{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.cw.gone .ch .t{text-decoration:line-through;color:var(--muted)}
.cw.gone .ch{border-style:dashed;border-color:var(--muted)}
.cw.gone .ch .l{border-color:var(--muted);color:var(--muted);position:relative}
.cw.gone .ch .l::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:2px solid var(--muted)}
.xb{flex:none;width:44px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.xb:hover{background:var(--soft)}
.xf{position:sticky;bottom:0;z-index:30;background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.xf-in{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;min-height:68px;padding-block:8px}
.xf-l{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.xf-c{position:relative;display:flex;justify-content:center}
.xf-r{display:flex;gap:10px;justify-content:flex-end}
.qnav{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.nbtn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:999px;padding:10px 26px;font-weight:700;min-height:42px}
.nbtn:hover{filter:brightness(1.1)}
.nbtn[disabled]{opacity:.4;cursor:not-allowed}
.navpop{left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);width:min(520px,calc(100vw - 24px))}
.navpop h3{font-size:1rem;text-align:center;margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gq{position:relative;width:42px;height:42px;border:2px dashed var(--blue);color:var(--blue);background:var(--paper);border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
.gq.done{border-style:solid;background:var(--blue);color:var(--blue-ink)}
.gq.cur{outline:3px solid var(--ink);outline-offset:2px}
.gq .fl{position:absolute;top:-9px;right:-7px;color:var(--flag);line-height:0}
.gq .fl svg{fill:var(--flag)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:2px dashed var(--blue)}
.sw.s{border-style:solid;background:var(--blue)}
.navpop .go{display:block;margin:14px auto 0}
.rv{max-width:760px;margin:0 auto;padding:44px max(20px,env(safe-area-inset-left,0px)) 60px;display:flex;flex-direction:column;gap:20px;text-align:center;flex:1}
.rv h1{font-size:1.8rem}
.rvbox{border:2px solid var(--ink);border-radius:14px;padding:22px}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.55);z-index:70;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}

/* ---------- Results ---------- */
.score-hd{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:2rem;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:3px solid var(--blue);color:var(--blue);font-weight:700;letter-spacing:.14em;padding:2px 12px;border-radius:6px;transform:rotate(-5deg);font-size:.85rem}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 32px}
.srow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.srow .sn{width:28px;font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--muted)}
.bub.pick{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bub.pick.right{background:var(--good);border-color:var(--good);color:#fff}
.bub.pick.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.bub.key{border:2px dashed var(--good);color:var(--good)}
.srow .res{margin-left:auto;font-size:.8rem;font-weight:700}
.skills{display:flex;flex-direction:column;gap:12px}
.skills .sk{display:grid;grid-template-columns:minmax(120px,220px) 1fr 54px;gap:12px;align-items:center;font-size:.9rem}
.tabs{display:flex;gap:8px}
.tab{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.9rem}
.tab.on{background:var(--ink);color:var(--paper)}
.rq{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.rq .ptxt{font-family:var(--serif);font-size:1.05rem;line-height:1.65;border-left:3px solid var(--line);padding-left:14px;max-width:65ch}
.rq .ptxt p+p{margin-top:.8em}
.ro{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.ro .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.82rem}
.ro.ok{border-color:var(--good);background:var(--good-bg)}
.ro.ok .l{background:var(--good);border-color:var(--good);color:#fff}
.ro.no{border-color:var(--bad);background:var(--bad-bg)}
.ro.no .l{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{background:var(--blue-soft);border-radius:10px;padding:14px 16px;font-size:.95rem}
.expl b{color:var(--blue)}
.expl p+p{margin-top:.6em}
img.qpic{display:block;width:100%;max-width:900px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.picwrap{margin:0 0 18px}
.xm.single.picmode .qpane{max-width:960px;margin:0 auto;width:100%}.picmode .qhead{margin-bottom:12px}
.choices.letters{flex-direction:row;flex-wrap:wrap}
.choices.letters .cw{flex:1 1 70px}.picwrap{overflow-x:auto}img.qpic.zoom{width:210%;max-width:none;cursor:zoom-out}img.qpic{cursor:zoom-in}.zh{font-size:.8rem;color:var(--muted);margin:-6px 0 14px}
.choices.letters .ch{justify-content:center;min-height:64px}
.choices.letters .l{font-size:1.3rem}
@media(min-width:900px){.xm.single.picmode .qpane{display:grid;grid-template-columns:minmax(0,1fr) 170px;column-gap:24px;row-gap:0;align-items:start;max-width:1180px}.picmode .qhead{grid-column:1/-1}.picmode .picwrap,.picmode .zh{grid-column:1}.picmode .choices.letters{grid-column:2;grid-row:2/span 2;flex-direction:column;position:sticky;top:12px}.picmode .choices.letters .cw{flex:none}}
@media(max-width:899px){.picmode .choices.letters{position:sticky;bottom:0;background:var(--paper);padding:10px 0 6px;z-index:2;margin-top:6px}}
img.fig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
img.thumb{height:70px;max-width:140px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fff}
u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.qed{border-top:1px solid var(--line)}
.qed summary{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:12px 0;cursor:pointer;list-style:none}
.qed summary::-webkit-details-marker{display:none}
.qed summary .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qed summary .s{overflow-wrap:anywhere;font-size:.92rem}
.qed[open] summary{border-bottom:1px dashed var(--line)}
.qbody{display:flex;flex-direction:column;gap:10px;padding:14px 0 18px}
.qbody label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qbody textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);resize:vertical}
.orow{display:flex;gap:10px;align-items:center}
.orow .l{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.orow input.txt{border-width:1px;min-width:0}
.orow input[type=radio]{width:20px;height:20px;accent-color:var(--blue);flex:none;margin:0}
@media (max-width:860px){
  .xm{grid-template-columns:1fr}
  .pane.passage{border-right:0;border-bottom:3px solid var(--line)}
  .qhead{margin:-26px -20px 20px}
}
@media (max-width:640px){
  .xh-in{grid-template-columns:1fr auto;}
  .xh-r{grid-column:1/-1;justify-content:flex-start;order:3;margin-top:-4px}
  .xf-in{grid-template-columns:auto 1fr;}
  .xf-l{display:none}
  .xf-c{justify-content:flex-start}
  .ticket{grid-template-columns:1fr}
  .ticket::before,.ticket::after{display:none}
  .t-stub{border-left:0;border-top:2px dashed var(--ink);flex-direction:row}
  .t-stub .barcode{width:120px}
  .score-hd{grid-template-columns:1fr;justify-items:start}
  .sheet{grid-template-columns:1fr}
  .skills .sk{grid-template-columns:1fr 54px}
  .skills .sk .bar{grid-column:1/-1;order:3}
  .t-main{padding:20px}
  .t-main h2{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app"></div>

<script>
/*PARSER-START*/
/* ---------- Any text to questions (layout-agnostic) ---------- */
function cleanLines(raw){
  var out=[],carry=false;
  raw.forEach(function(l){
    var t=String(l.t).replace(/[\u00a0\u2007\u202f]/g,' ').replace(/\s+/g,' ').trim();
    if(!t){carry=carry||!!l.p;return;}
    out.push({t:t,p:!!(l.p||carry),s:l.s});carry=false;
  });
  return out;
}
var BUL=/^[\u2022\u25cf\u25aa\u25a0*\u2013-]\s+/;
var BUB=/^(?:[\u00a9\u00ae@\u25cb\u25cf\u25ef\u2299\u2297\u25c9]|[oO0Q])\s+(?=\S)/;
var CHRE=/^[\(\[]?([A-Da-d])[\)\]\.:\u2013\u2014-]\s*(\S.*)$/;
var ANSRE=/^(?:the\s+)?(?:correct\s+)?(?:answer|ans|key)\s*(?:is\b)?\s*[:=\u2013-]?\s*(?:choice\s+|option\s+)?\(?([A-Da-d])\)?(?![A-Za-z])\s*[.:\u2013\u2014-]*\s*(.*)$/i;
var EXPLRE=/^(?:rationale|explanation|solution)s?\b\s*[:\u2013-]?\s*(.*)$/i;
var STEMRE=/^(?:Which (?:choice|of the following|finding|quotation|statement|sentence|detail|claim|conclusion|option|word|phrase|best)|Based on the (?:text|passage|information)|According to the (?:text|passage)|As used in the text|What (?:is|does|would|can|do|are)|The student wants|Choose the|Select the)/i;
var STRONG=/^(?:Choice|Option)\s+[A-D]\b|^(?:The\s+)?correct answer\b|^Answer\b/i;
var ENTRY1=/^(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.):\-\u2013\u2014]+\s*(?:(?:correct\s+)?answer\s*:?\s*)?\(?([A-D])\)?(?![A-Za-z])[\s.:\-\u2013\u2014]*(.*)$/i;
var ENTRY2=/^(\d{1,3})\s+([A-D])\s*$/;
var ANSHEAD=/^(?:answer\s*key|answers?(?:\s*(?:and|&)\s*(?:rationales?|explanations?))?|answer\s*(?:explanations?|rationales?)|explanations?|rationales?|solutions?)\s*:?$/i;

function isStem(t){return STEMRE.test(t)||/\?\s*$/.test(t);}
function explLike(t){return /\b(?:Choice|Option)\s+[A-D]\b|\bbest answer\b|\bcorrect\b|\bincorrect\b|\bbecause\b|\bthis choice\b/i.test(t);}
function ansMatch(t){
  var m=t.match(ANSRE);if(!m)return null;
  if(m[1]===m[1].toLowerCase()&&!/[:=]/.test(t))return null;
  return {letter:m[1].toUpperCase(),rest:m[2]||''};
}
function chInfo(t){var m=t&&t.match(CHRE);return m?{k:'ABCD'.indexOf(m[1].toUpperCase()),text:m[2]}:null;}
function splitChoices(t){
  var parts=t.split(/\s+(?=[A-D][.)]\s)/);
  if(parts.length<2||!/^\(?A[.)]/.test(parts[0]))return [t];
  for(var i=0;i<parts.length;i++){if(!new RegExp('^\\(?'+'ABCD'[i]+'[.)]').test(parts[i]))return [t];}
  return parts;
}
function expandChoices(lines){
  var out=[];
  lines.forEach(function(l){
    var parts=splitChoices(l.t);
    parts.forEach(function(p,i){out.push({t:p,p:i===0?l.p:false,s:l.s});});
  });
  return out;
}
function joinLines(ls){var s='';ls.forEach(function(l,i){s+=(i===0?'':(BUL.test(l.t)?'\n':' '))+l.t;});return s;}
function toParas(ls){
  var out=[],cur=[];
  ls.forEach(function(l){if(l.p&&cur.length){out.push(cur);cur=[];}cur.push(l);});
  if(cur.length)out.push(cur);
  return out;
}
function isMeta(t){
  if(t.length>220)return false;
  if(/^[\u25cf\u25cb\u2022\u25e6\u2b24\u25ef\s]{3,}$/.test(t))return true;
  if(/^Difficulty\s*:?\s*(?:Easy|Medium|Hard|[\u25cf\u25cb\u2022\u25e6\u2b24\u25ef\s]+)?$/i.test(t))return true;
  return /^(?:Assessment|Test|Domain|Skill|Difficulty)\b/.test(t)&&/\b(?:Difficulty|Domain|Skill)\b/.test(t);
}


/* College Board style header: Question ID, Assessment, Test, Domain, Skill, Difficulty (words or dots) */
var SKILLS=['Central Ideas and Details','Command of Evidence','Inferences','Words in Context','Text Structure and Purpose','Cross-Text Connections','Rhetorical Synthesis','Transitions','Boundaries','Form, Structure, and Sense'];
var DOMAINS=['Information and Ideas','Craft and Structure','Expression of Ideas','Standard English Conventions'];
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
var META_RE=new RegExp('(?:'+SKILLS.concat(DOMAINS).map(reEsc).join('|')+'|Reading and Writing|SAT Suite|Question Bank|College Board|Question Difficulty|Question ID|Assessment|Domain|Skill|Difficulty|Test|SAT|Math|Easy|Medium|Hard|ID)(?:\\s*\\((?:Textual|Quantitative|[A-Za-z ]{3,20})\\))?','gi');
function vocabMeta(t){
  if(t.length>200)return false;
  if(/^(?=[0-9a-f]*\d)(?=[0-9a-f]*[a-f])[0-9a-f]{6,10}$/i.test(t))return true;
  var n=0,rest=t.replace(/Page\s*\d+\s*(?:of\s*\d+)?/gi,function(){n++;return ' ';}).replace(META_RE,function(m){n++;return ' ';});
  rest=rest.replace(/\b(?=[0-9a-f]*\d)(?=[0-9a-f]*[a-f])[0-9a-f]{6,10}\b/gi,' ').replace(/[\s|:;,.●○•◦⬤◯■□★☆\-–—\/()]+/g,'');
  if(rest)return false;
  if(n>=2)return true;
  return n===1&&new RegExp('^(?:'+SKILLS.concat(DOMAINS).map(reEsc).join('|')+'|Question Bank|College Board|SAT Suite)','i').test(t);
}

/* key (answer list) */
function compactPairs(t){
  var re=/(?:^|\s)(\d{1,3})\s*[.):\-\u2013]?\s*([A-D])(?![A-Za-z])/g,m,out=[];
  while((m=re.exec(t)))out.push({n:+m[1],a:m[2]});
  return out;
}
function isKeyish(t){
  if(ENTRY2.test(t))return true;
  var m=t.match(ENTRY1);if(m&&t.length<=14)return true;
  var cp=compactPairs(t);if(cp.length>=3&&t.length<cp.length*12)return true;
  if(/^(?:answers?|answer key|key)\s*:?\s*[A-D](?:[\s,;.-]+[A-D])+$/i.test(t))return true;
  return /^[A-D](?:[\s,;]+[A-D]){4,}$/i.test(t);
}
function findAnswerSection(lines){
  for(var i=3;i<lines.length;i++){
    if(!ANSHEAD.test(lines[i].t))continue;
    var hits=0;
    for(var j=i+1;j<Math.min(lines.length,i+10);j++){
      if(isKeyish(lines[j].t)||ENTRY1.test(lines[j].t))hits++;
      else if(/^(?:Question\s*)?\d{1,3}[.):]?$/i.test(lines[j].t)&&lines[j+1]&&/^(?:Correct\s+)?Answer\s*:?\s*\(?[A-D]/i.test(lines[j+1].t))hits++;
    }
    if(hits>=2)return i;
  }
  return -1;
}
function findTrailingKey(lines){
  var idx=lines.length,count=0;
  while(idx>0&&isKeyish(lines[idx-1].t)){
    idx--;
    var cp=compactPairs(lines[idx].t);count+=cp.length>=2?cp.length:(/[A-D][\s,;.-]+[A-D]/.test(lines[idx].t)?2:1);
  }
  return (count>=2&&idx>0&&idx<lines.length)?idx:-1;
}
function parseAnswerSection(lines){
  var map={},order=[],cur=null,m,m2;
  for(var i=0;i<lines.length;i++){
    var t=lines[i].t;
    var cp=compactPairs(t);
    if(cp.length>=2&&t.length<cp.length*12+10){cp.forEach(function(c){if(!map[c.n]){map[c.n]={n:c.n,a:c.a,x:''};order.push(map[c.n]);}});cur=null;continue;}
    var lm=t.replace(/^(?:answers?|answer key|key)\s*:?\s*/i,'');
    if(/^[A-D](?:[\s,;.-]+[A-D])+$/i.test(lm)&&(lm.length!==t.length||lm.length>=9)){lm.toUpperCase().match(/[A-D]/g).forEach(function(a,k){var e={n:k+1,a:a,x:''};if(!map[k+1])map[k+1]=e;order.push(e);});cur=null;continue;}
    if((m=t.match(/^(?:Question\s*)?(\d{1,3})[.):]?$/i))&&lines[i+1]&&(m2=lines[i+1].t.match(/^(?:Correct\s+)?Answer\s*:?\s*\(?([A-D])\)?(?![A-Za-z])[\s.:\-\u2013\u2014]*(.*)$/i))){
      cur={n:+m[1],a:m2[1].toUpperCase(),xl:[]};map[cur.n]=cur;order.push(cur);
      if(m2[2])cur.xl.push({t:m2[2],p:false});
      i++;continue;
    }
    if((m=t.match(ENTRY1))||(m=t.match(ENTRY2))){
      cur={n:+m[1],a:m[2].toUpperCase(),xl:[]};map[cur.n]=cur;order.push(cur);
      if(m[3]&&m[3].trim())cur.xl.push({t:m[3],p:lines[i].p});
      continue;
    }
    if(cur&&cur.xl)cur.xl.push(lines[i]);
  }
  order.forEach(function(e){
    if(e.xl){e.x=joinLines(e.xl).replace(/^(?:Rationale|Explanation)\s*:?\s*/i,'');delete e.xl;}
  });
  return {map:map,order:order};
}

/* prepare: tag cue lines (Question ID, Question N) and metadata */
function prep(lines){
  var L=[],expect=1;
  lines.forEach(function(l){
    var t=l.t,m,m2,mm;
    if(/^Question\s*ID\b/i.test(t)){L.push({t:t,p:l.p,cue:'qid',meta:true});return;}
    if(/^[I1l]D:\s*\S{4,}/i.test(t))return;
    if(isMeta(t)||vocabMeta(t)){L.push({t:t,p:l.p,meta:true});return;}
    m=t.match(/^(?:Question|Q)\s*\.?\s*(\d{1,3})\s*[.:)\-]?\s*(.*)$/i);
    m2=!m&&t.match(/^(\d{1,3})\s*[.)]\s+(\S.*)$/);
    mm=m||m2;
    if(mm&&+mm[1]===expect&&!(m2&&CHRE.test(t))){
      expect++;
      L.push({t:mm[2]||'',p:true,cue:'num',num:+mm[1],s:l.s});return;
    }
    L.push({t:t,p:l.p,s:l.s});
  });
  for(var z=0;z<L.length;z++){
    if(!L[z].meta&&!L[z].cue&&/^(?:Easy|Medium|Hard)$/i.test(L[z].t)&&((L[z-1]&&L[z-1].meta)||(L[z+1]&&L[z+1].meta)))L[z].meta=true;
  }
  return L;
}

/* find runs of answer choices */
function findRuns(L){
  var runs=[],i=0;
  while(i<L.length){
    var a=(L[i].t&&!L[i].meta&&!L[i].cue)?chInfo(L[i].t):null;
    if(!a||a.k!==0){i++;continue;}
    var ch=[a.text],last=i,next=1,real=1,j=i+1;
    while(j<L.length&&next<4){
      var x=L[j];
      if(!x.t){j++;continue;}
      if(x.cue||x.meta||ansMatch(x.t)||EXPLRE.test(x.t)||STEMRE.test(x.t))break;
      var c=chInfo(x.t);
      if(c&&c.k===next){ch.push(c.text);last=j;next++;real++;j++;continue;}
      if(c&&c.k<next)break;
      if(L[last].t.length>=75){ch[ch.length-1]+=' '+x.t;last=j;j++;continue;}
      if(x.t.length<=220){ch.push(x.t.replace(BUB,''));last=j;next++;j++;continue;}
      break;
    }
    if(next===4){
      j=last+1;
      while(j<L.length&&L[j].t&&!L[j].cue&&!L[j].meta&&!L[j].p&&L[last].t.length>=75&&!ansMatch(L[j].t)&&!EXPLRE.test(L[j].t)&&!chInfo(L[j].t)&&!isStem(L[j].t)&&L[j].t.length<200){ch[3]+=' '+L[j].t;last=j;j++;}
    }
    if(ch.length>=3&&real>=2){runs.push({s:i,e:last,ch:ch,marked:true});i=last+1;}else i++;
  }
  return runs;
}
function findUnmarked(L,runs,strict){
  var inRun={},out=[],i,k;
  runs.forEach(function(r){for(k=r.s;k<=r.e;k++)inRun[k]=1;});
  for(i=0;i<L.length;i++){
    var l=L[i];
    if(inRun[i]||!l.t||l.meta||l.cue)continue;
    if(!(strict?STEMRE.test(l.t):isStem(l.t)))continue;
    var j=i+1;
    while(L[j]&&L[j].t&&/^[a-z]/.test(L[j].t)&&!/[?.:]\s*$/.test(L[j-1].t))j++;
    var ch=[],end=j-1;
    while(j<L.length&&ch.length<4){
      var x=L[j];
      if(!x.t){j++;continue;}
      if(inRun[j]||x.cue||x.meta||ansMatch(x.t)||EXPLRE.test(x.t)||STEMRE.test(x.t))break;
      if(x.t.length>220)break;
      ch.push(x.t.replace(BUB,''));end=j;j++;
    }
    if(ch.length>=3){out.push({s:end-ch.length+1,e:end,ch:ch,marked:false});for(k=i+1;k<=end;k++)inRun[k]=1;i=end;}
  }
  return out;
}

/* split the text between two runs into [answer + explanation of one] and [passage + question of the next] */
function splitMid(reg){
  var meta=reg.filter(function(l){return l.meta&&!l.cue;}),cueI=-1,i;
  for(i=reg.length-1;i>=0;i--){if(reg[i].cue){cueI=i;break;}}
  if(cueI>=0)return {tail:reg.slice(0,cueI).filter(function(l){return !l.meta;}),head:reg.slice(cueI)};
  reg=reg.filter(function(l){return !l.meta&&l.t;});
  var si=-1;
  for(i=reg.length-1;i>=0;i--){if(isStem(reg[i].t)){si=i;break;}}
  if(si<0)si=reg.length-1;
  var m=-1;
  for(i=0;i<si;i++){if(ansMatch(reg[i].t)||EXPLRE.test(reg[i].t))m=i;}
  if(m<0&&reg.length&&si>0&&STRONG.test(reg[0].t))m=0;
  if(m<0)return {tail:[],head:meta.concat(reg)};
  var lastExpl=m;
  for(i=m+1;i<si;i++){if(explLike(reg[i].t))lastExpl=i;}
  var h=-1;
  for(i=lastExpl+1;i<=si;i++){if(reg[i].p){h=i;break;}}
  if(h<0)h=lastExpl+1;
  return {tail:reg.slice(0,h),head:meta.concat(reg.slice(h))};
}
function splitStem(s){
  var re=/(?:^|[.!?\u201d"]\s+)(Which (?:choice|of the following|finding|quotation|statement|sentence|detail|claim|conclusion|option|word|phrase)|Based on the (?:text|passage)|According to the (?:text|passage)|As used in the text|What (?:is|does|would)|The student wants|Choose the)/g,mm,last=-1;
  while((mm=re.exec(s)))last=mm.index+mm[0].length-mm[1].length;
  if(last>=15)return [s.slice(0,last).trim(),s.slice(last).trim()];
  return null;
}
function parseHead(hl,first){
  var meta=[],lines=[],num=null;
  hl.forEach(function(l){
    if(l.num&&num===null)num=l.num;
    if(l.meta)meta.push(l.t);else if(l.t)lines.push(l);
  });
  var paras=toParas(lines).map(joinLines),i;
  if(first)while(paras.length>=2&&paras[0].length<60&&!BUL.test(paras[0])&&!/[.?!:"\u201d_]$/.test(paras[0])&&!isStem(paras[0]))paras.shift();
  var qi=-1;
  for(i=paras.length-1;i>=0;i--){if(isStem(paras[i])){qi=i;break;}}
  if(qi<0)qi=paras.length-1;
  var q='',pre=[],inline='';
  if(qi>=0){
    q=paras[qi];pre=paras.slice(0,qi);
    var sp=splitStem(q);if(sp){inline=sp[0];q=sp[1];}
  }
  var p=pre.join('\n\n');
  if(inline)p+=(p?'\n\n':'')+inline;
  q=q.replace(/^(?:Question\s*)?\d{1,3}\s*[.)]\s+/i,'');
  var M=meta.join(' '),d=null,skill='';
  var dm=M.match(/Difficulty\s*:?\s*(Easy|Medium|Hard)/i);
  if(dm)d=dm[1][0].toLowerCase();
  else{
    var dots=M.match(/Difficulty\s*:?\s*([\u25cf\u25cb\u2022\u25e6\u2b24\u25ef ]{3,})/)||M.match(/^([\u25cf\u25cb\u2022\u25e6\u2b24\u25ef ]{3,})$/);
    if(dots){var cnt=(dots[1].match(/[\u25cf\u2022\u2b24]/g)||[]).length;d=cnt<=1?'e':cnt===2?'m':'h';}
  }
  if(!d){var lw=M.match(/\b(Easy|Medium|Hard)\b/i);if(lw)d=lw[1][0].toLowerCase();}
  for(var sj=0;sj<SKILLS.length&&!skill;sj++)if(M.toLowerCase().indexOf(SKILLS[sj].toLowerCase())>=0)skill=SKILLS[sj];
  var sk=skill?null:M.match(/Skill\s*:?\s*(.+?)\s*(?:Difficulty|$)/i);if(sk)skill=sk[1].trim();
  if(!skill){var dom=M.match(/Domain\s*:?\s*(.+?)\s*(?:Skill|Difficulty|$)/i);if(dom)skill=dom[1].trim();}
  return {p:p,q:q,d:d,t:skill,num:num};
}
function parseTail(tl){
  var a=null,expl=[];
  tl.forEach(function(l){
    if(!l.t)return;
    var am=ansMatch(l.t);
    if(am&&a===null){
      a=am.letter;
      var r=am.rest.replace(/^(?:Rationale|Explanation)\s*:?\s*/i,'');
      if(r)expl.push({t:r,p:false});
      return;
    }
    var em=l.t.match(EXPLRE);
    if(em){if(em[1])expl.push({t:em[1],p:l.p});return;}
    expl.push(l);
  });
  return {a:a,x:joinLines(expl)};
}

/* where on the page(s) a question sits, so it can be shown as a picture exactly as in the file */
function regionOf(head,runLines){
  var hs=head.filter(function(l){return !l.meta&&l.t;}),i,cut=-1;
  for(i=0;i<hs.length;i++)if(ansMatch(hs[i].t)||EXPLRE.test(hs[i].t))cut=i;
  if(cut>=0){var h2=-1;for(i=cut+1;i<hs.length;i++)if(hs[i].p){h2=i;break;}hs=h2<0?[]:hs.slice(h2);}
  var all=hs.concat(runLines.filter(function(l){return l.t;})),order=[],map={};
  all.forEach(function(l){
    var s=l.s;if(!s)return;
    var r=map[s.k];
    if(!r){r=map[s.k]={k:s.k,f:s.f,y0:s.y0,y1:s.y1,x0:s.x0,x1:s.x1};order.push(r);}
    else{r.y0=Math.min(r.y0,s.y0);r.y1=Math.max(r.y1,s.y1);r.x0=Math.min(r.x0,s.x0);r.x1=Math.max(r.x1,s.x1);}
  });
  return order;
}

function parseDocument(raw){
  var lines=expandChoices(cleanLines(raw)),warn=[],key={map:{},order:[]},body=lines;
  var as=findAnswerSection(lines),kStart=-1,bodyEnd=lines.length;
  if(as>=0){bodyEnd=as;kStart=as+1;}
  else{var tk=findTrailingKey(lines);if(tk>=0){bodyEnd=tk;kStart=tk;}}
  if(kStart>=0){key=parseAnswerSection(lines.slice(kStart));body=lines.slice(0,bodyEnd);}
  var L=prep(body),runs=findRuns(L);
  var um=findUnmarked(L,runs,runs.length>=2);
  runs=runs.concat(um).sort(function(a,b){return a.s-b.s;});
  if(!runs.length)return {questions:[],warn:['No answer choices were found in the text. Questions need at least three answer choices, with or without letters in front.']};
  var parts=[],k;
  for(k=0;k<runs.length;k++){
    var from=k===0?0:runs[k-1].e+1,reg=L.slice(from,runs[k].s),head;
    if(k===0)head=reg;
    else{var sp=splitMid(reg);head=sp.head;parts[k-1].tail=sp.tail;}
    parts.push({run:runs[k],head:head,tail:[]});
  }
  parts[parts.length-1].tail=L.slice(runs[runs.length-1].e+1);
  var qs=[],anyD=false;
  parts.forEach(function(pt,i){
    var h=parseHead(pt.head,i===0),t=parseTail(pt.tail),a=t.a?'ABCD'.indexOf(t.a):-1;
    var ch=pt.run.ch.map(function(c,j){
      var m=c.match(/\s*(?:[\u2713\u2714\u2611]|\((?:correct|answer)\)|\[correct\])\s*$/i);
      if(m){if(a<0)a=j;return c.slice(0,m.index).trim();}
      return c.trim();
    });
    if(!h.q&&!h.p)return;
    var q={d:h.d||'u',t:h.t||'Practice',p:h.p,q:h.q,o:ch,a:a,x:t.x,_n:h.num,_r:regionOf(pt.head,L.slice(pt.run.s,pt.run.e+1))};
    if(q.d!=='u')anyD=true;
    qs.push(q);
  });
  qs.forEach(function(q,i){
    if(q.a<0||!q.x){
      var e=key.map[q._n||(i+1)];
      if(!e&&key.order.length===qs.length)e=key.order[i];
      if(e){if(q.a<0)q.a='ABCD'.indexOf(e.a);if(!q.x)q.x=e.x||'';}
    }
    delete q._n;
    if(anyD&&q.d==='u')q.d='m';
  });
  return {questions:qs,warn:mkWarn(qs,runs.filter(function(r){return !r.marked;}).length),unmarked:runs.filter(function(r){return !r.marked;}).length};
}
function mkWarn(qs,unm){
  var warn=[];
  var noAns=qs.filter(function(q){return q.a<0;}).length;
  if(noAns)warn.push(noAns+' question'+(noAns===1?' has':'s have')+' no answer yet. Choose the correct letter for each one below.');
  var noX=qs.filter(function(q){return !q.x;}).length;
  if(noX&&qs.length)warn.push(noX+' question'+(noX===1?' has':'s have')+' no explanation in the file.');
  if(unm)warn.push(unm+' question'+(unm===1?' has':'s have')+' answer choices without letters in front. They were lined up as A, B, C, D in the order they appear.');
  return warn;
}
/* several files: read each one alone, and also all together (an answer key can be in its own file) */
function parseMany(rawParts){
  var sep=[],unm=0,first=null;
  rawParts.forEach(function(r){var x=parseDocument(r);if(!first)first=x;sep=sep.concat(x.questions);unm+=x.unmarked||0;});
  if(rawParts.length<2)return first||{questions:[],warn:['No text was found.']};
  var all=[];rawParts.forEach(function(r){all=all.concat(r,[{t:'',p:true}]);});
  var comb=parseDocument(all);
  function score(a){return a.filter(function(q){return q.a>=0;}).length*1000+a.length;}
  if(comb.questions.length&&score(comb.questions)>score(sep))return comb;
  if(!sep.length)return comb.questions.length?comb:{questions:[],warn:(first&&first.warn)||comb.warn};
  return {questions:sep,warn:mkWarn(sep,unm),unmarked:unm};
}

var WIC='Which choice completes the text with the most logical and precise word or phrase?';
var TR='Which choice completes the text with the most logical transition?';

Q('e','Words in Context',"The scientist's explanation was so _____ that even the youngest students in the room could follow every step.",WIC,['convoluted','lucid','vague','elaborate'],1,'"Even the youngest students could follow" tells you the explanation was easy to understand. Lucid means clear. Convoluted and vague mean the opposite.'),
Q('e','Transitions','Maya studied for weeks before the exam. _____ she felt confident when she walked into the room.',TR,['However,','As a result,','For instance,','Meanwhile,'],1,'Weeks of studying is the cause and feeling confident is the effect, so the transition signals cause and effect: As a result.'),
Q('e','Form, Structure, Sense','The collection of rare stamps _____ displayed in the lobby.',SE,['are','is','were','have been'],1,'The subject is "collection," which is singular. "Of rare stamps" is only a modifier, so the verb is singular: is.'),

Q('e','Transitions','The first prototype was too heavy to carry. _____ the engineers redesigned it using lighter materials.',TR,['Nevertheless,','Consequently,','Likewise,','In contrast,'],1,'The prototype was too heavy (cause), so the engineers redesigned it (effect). Consequently means as a result.'),
Q('e','Central Ideas','Urban green spaces do more than beautify cities. Studies show that parks lower summer temperatures, absorb stormwater, and give residents places to exercise and gather.','Which choice best states the main idea of the text?',['Parks are more expensive than they appear.','Parks provide several practical benefits to cities.','Cities should avoid building parks.','Summers are getting hotter everywhere.'],1,'The text lists several benefits: cooler temperatures, stormwater control, and places to exercise and gather.'),

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s,im){return esc(s).replace(/\[img:(\d+)\]/g,function(m,n){return im&&im[n]?'<img class="fig" alt="Figure" src="'+im[n]+'">':'';}).replace(/\[u\]([\s\S]*?)\[\/u\]/g,'<u>$1</u>').replace(/\[\/?u\]/g,'');}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function usedIdx(b){var u={};b.days.forEach(function(d){d.qids.forEach(function(i){u[i]=1;});});return u;}
function leftCount(b){var u=usedIdx(b);return b.qs.filter(function(q,i){return !u[i];}).length;}
function buildSet(b){
  var u=usedIdx(b),idx=[];b.qs.forEach(function(q,i){if(!u[i])idx.push(i);});
  var hasD=b.qs.some(function(q){return q.d!=='u';});
  if(!hasD)return idx.slice(0,PER);
  var by={e:[],m:[],h:[]};idx.forEach(function(i){var d=b.qs[i].d;by[d==='u'?'m':d].push(i);});
  by.e=shuffle(by.e);by.m=shuffle(by.m);by.h=shuffle(by.h);
  var out=[];
  if(by.e.length){
    out=by.e.slice(0,8);
    var mix=by.m.slice(0,2),need=PER-out.length-mix.length;
    if(need>0){var more=by.m.slice(mix.length,mix.length+need);mix=mix.concat(more);need-=more.length;}
    if(need>0)mix=mix.concat(by.h.slice(0,need));
    mix.forEach(function(q,i){out.splice(Math.min(out.length,3+i*4),0,q);});
  }else if(by.m.length){
    out=by.m.slice(0,PER);
    if(out.length<PER)out=out.concat(by.h.slice(0,PER-out.length));
  }else out=by.h.slice(0,PER);
  return out;
}
function phase(b){
  var u=usedIdx(b),c={e:0,m:0,h:0},hasD=b.qs.some(function(q){return q.d!=='u';});
  b.qs.forEach(function(q,i){if(!u[i])c[q.d==='u'?'m':q.d]++;});
  if(!hasD)return {n:'In order',note:'Questions come in the order they appear in your PDF'};
  if(c.e>0)return {n:'Easy phase',note:'Mostly easy, with a couple of medium questions mixed in'};
  if(c.m>0)return {n:'Medium phase',note:'Medium questions'};
  if(c.h>0)return {n:'Hard phase',note:'Hard questions'};
  return {n:'Finished',note:'You have worked through every question'};
}
function newDay(b){

}

function streak(){
  var set={};allDone().forEach(function(d){set[d.date]=1;});

}

      out.push({t:l.t,p:l.p,s:l.s});
    });
  });
  return out;
}


/* Figures: pictures and drawn charts/tables. Returns boxes (PDF page units, y up) to be cut out of the page. */
function figRegions(fn,args,OPS,pw,ph,items){
  var ev=normOps(fn,args,OPS),ctm=[1,0,0,1,0,0],stack=[],shapes=[],pb=null,pn=0;
  function ext(x,y){var X=ctm[0]*x+ctm[2]*y+ctm[4],Y=ctm[1]*x+ctm[3]*y+ctm[5];
    if(!pb)pb={x1:X,x2:X,y1:Y,y2:Y};else{if(X<pb.x1)pb.x1=X;if(X>pb.x2)pb.x2=X;if(Y<pb.y1)pb.y1=Y;if(Y>pb.y2)pb.y2=Y;}}
  var txt=(items||[]).filter(function(t){return t.str&&t.str.trim();}).map(function(t){return {x1:t.transform[4],x2:t.transform[4]+(t.width||0),y:t.transform[5],h:Math.abs(t.transform[3])||10};});
  function textAbove(s){for(var i=0;i<txt.length;i++){var t=txt[i];if(s.x1<t.x2&&s.x2>t.x1&&s.y1>=t.y-t.h*.5&&s.y1<=t.y+t.h*.15)return true;}return false;}
  function commit(){
    if(pb&&pn){
      var w=pb.x2-pb.x1,h=pb.y2-pb.y1;
      var thin=h<=2.8&&w<pw*.5;
      var bg=w>pw*.85&&h>ph*.6;
      if(!bg&&!(thin&&textAbove(pb))&&w+h>2)shapes.push({x1:pb.x1,x2:pb.x2,y1:pb.y1,y2:pb.y2,n:pn});
    }
    pb=null;pn=0;
  }
  function img(){
    var xs=[0,1,1,0],ys=[0,0,1,1],x1=1e9,x2=-1e9,y1=1e9,y2=-1e9;
    for(var i=0;i<4;i++){var X=ctm[0]*xs[i]+ctm[2]*ys[i]+ctm[4],Y=ctm[1]*xs[i]+ctm[3]*ys[i]+ctm[5];x1=Math.min(x1,X);x2=Math.max(x2,X);y1=Math.min(y1,Y);y2=Math.max(y2,Y);}
    var w=x2-x1,h=y2-y1;
    if(w>=40&&h>=40&&!(w>pw*.85&&h>ph*.85))shapes.push({x1:x1,x2:x2,y1:y1,y2:y2,n:4});
  }
  for(var q=0;q<ev.length;q++){
    var e=ev[q],t=e[0];
    if(t==='s')stack.push(ctm.slice());
    else if(t==='r'){if(stack.length)ctm=stack.pop();}
    else if(t==='t')ctm=mulM(e[1],ctm);
    else if(t==='I')img();
    else if(t==='R'){ext(e[1],e[2]);ext(e[1]+e[3],e[2]+e[4]);pn++;}
    else if(t==='m'){ext(e[1],e[2]);pn++;}
    else if(t==='l'||t==='c')ext(e[1],e[2]);
    else if(t==='P')commit();
    else if(t==='E'){pb=null;pn=0;}
    if(shapes.length>4000)break;
  }
  /* join shapes that touch or nearly touch */
  var GAP=10,ch=true,g=shapes.slice();
  while(ch){
    ch=false;
    for(var x=0;x<g.length;x++)for(var y=x+1;y<g.length;y++){
      var A=g[x],B=g[y];
      if(A.x1-GAP<=B.x2&&B.x1-GAP<=A.x2&&A.y1-GAP<=B.y2&&B.y1-GAP<=A.y2){
        A.x1=Math.min(A.x1,B.x1);A.x2=Math.max(A.x2,B.x2);A.y1=Math.min(A.y1,B.y1);A.y2=Math.max(A.y2,B.y2);A.n+=B.n;g.splice(y,1);y--;ch=true;
      }
    }
  }
  var out=[];
  g.forEach(function(r){
    var w=r.x2-r.x1,h=r.y2-r.y1;
    if(w<70||h<45||r.n<4)return;
    /* axis numbers and labels sit just outside the drawing */
    for(var pass=0;pass<2;pass++)(items||[]).forEach(function(t){
      var s=(t.str||'').trim();
      if(!s||s.length>14||/^[A-D][).]$/.test(s))return;
      var x=t.transform[4],y=t.transform[5],tw=t.width||0,th=Math.abs(t.transform[3])||10;
      if(x+tw>=r.x1-18&&x<=r.x2+18&&y>=r.y1-22&&y<=r.y2+22&&!(x>=r.x1&&x+tw<=r.x2&&y>=r.y1&&y<=r.y2)){
        r.x1=Math.min(r.x1,x);r.x2=Math.max(r.x2,x+tw);r.y1=Math.min(r.y1,y-th*.3);r.y2=Math.max(r.y2,y+th);
      }
    });
    w=r.x2-r.x1;h=r.y2-r.y1;
    if(w>pw*.95&&h>ph*.8)return;
    /* a frame around ordinary paragraphs is not a figure */
    var rows={};
    (items||[]).forEach(function(t){
      if(!t.str)return;var cx=t.transform[4]+(t.width||0)/2,cy=t.transform[5];
      if(cx>=r.x1&&cx<=r.x2&&cy>=r.y1&&cy<=r.y2){var k=Math.round(cy/3);rows[k]=(rows[k]||0)+t.str.length;}
    });
    var long=0;for(var k in rows)if(rows[k]>=45)long++;
    if(long>=3)return;
    out.push(r);
  });
  out.sort(function(a,b){return b.y2-a.y2;});
  return out.slice(0,6);
}

    case 'pick':pickAns(i);break;
    case 'smode':view.smode=!view.smode;render(true);break;
    case 'cross':{day=curDay();var id=day.qids[view.qi];day.strike[id]=day.strike[id]||{};if(day.strike[id][i])delete day.strike[id][i];else day.strike[id][i]=true;save();render(true);break;}
    case 'flag':{day=curDay();var fid=day.qids[view.qi];if(day.flag[fid])delete day.flag[fid];else day.flag[fid]=true;save();render(true);break;}
    case 'next':closePops();if(view.qi<curDay().qids.length-1){view.qi++;render();}else{view.name='review';render();}break;
    case 'back':closePops();if(view.qi>0){view.qi--;render();}break;
    case 'backToQ':view.name='exam';view.qi=curDay().qids.length-1;render();break;
    case 'submitAsk':view.confirm=true;render(true);break;
    case 'submitNo':view.confirm=false;render(true);break;
    case 'submitYes':{day=curDay();gradeDay(b,day);day.done=true;day.date=today();save();view={name:'results',bi:S.banks.indexOf(b),di:view.di,f:'all'};render();break;}
    case 'filt':view.f=el.getAttribute('data-f');render(true);break;
  }
});
app.addEventListener('change',function(e){
  var el=e.target,ed=el.getAttribute&&el.getAttribute('data-ed');
  if(!ed)return;
  var q=imp.qs[+el.getAttribute('data-i')];if(!q)return;
  if(ed==='a')q.a=+el.getAttribute('data-j');
  else if(ed==='d')q.d=el.value;
});
app.addEventListener('input',function(e){
  var el=e.target,ed=el.getAttribute&&el.getAttribute('data-ed');
  if(el.id==='notesTa'){var day=curDay(),id=day.qids[view.qi];day.notes[id]=el.value;save();return;}
  if(el.id==='setName'){imp.name=el.value;return;}
  if(!ed)return;
  var q=imp.qs[+el.getAttribute('data-i')];if(!q)return;
  if(ed==='p'||ed==='q'||ed==='x')q[ed]=el.value;
  else if(ed==='o')q.o[+el.getAttribute('data-j')]=el.value;
});
document.addEventListener('focusin',function(e){var t=e.target;if(t&&t.getAttribute&&t.getAttribute('data-ed')&&/^(p|q|x|o)$/.test(t.getAttribute('data-ed')))window._lf=t;});
function alert2(i,m){imp.warn=[m];imp.openQ=+i;render(true);}
document.addEventListener('paste',function(e){
  if(view.name!=='imp'||imp.stage==='review'||!e.clipboardData)return;
  var fs=[].slice.call(e.clipboardData.files||[]);
  if(fs.length){e.preventDefault();handleFiles(fs);}
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input'||tag==='select')return;
  if(e.key==='Escape'&&(view.navOpen||view.dirOpen||view.notesOpen)){closePops();render(true);return;}
  if(view.name!=='exam'||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  if(map[k]!==undefined)pickAns(map[k]);
  else if(k==='arrowright'){closePops();var n=curDay().qids.length;if(view.qi<n-1){view.qi++;render();}else{view.name='review';render();}}
  else if(k==='arrowleft'){closePops();if(view.qi>0){view.qi--;render();}}
});
window.addEventListener('pagehide',save);
render();
app.addEventListener('click',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('qpic')&&t.closest('.picwrap'))t.classList.toggle('zoom');});
idbAll().then(function(o){var n=0;for(var k in o){PICS[k]=o[k];n++;}if(n&&view.name!=='imp')render(true);});
</script>
</body>
</html>
